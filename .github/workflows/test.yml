name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install the C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gdb

      - name: Install dependencies
        run: npm ci

      - name: Report the environment
        run: |
          gcc --version | head -1
          gdb --version | head -1
          gdb -q -nx -batch -ex "python print('python 3 support: ok')"

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (real gcc + gdb)
        run: npm run test:integration
